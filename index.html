<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAWN TO THE SPOTLIGHT — 2026 애니메이션·웹툰 졸업상영회</title>
<meta name="description" content="2026 애니메이션 & 웹툰 졸업상영회 온라인 상영회 — 올드 할리우드 프리미어 나이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poiret+One&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#program">본문(상영 프로그램)으로 바로가기</a>

<!-- ===== 3.1 오프닝 히어로 ===== -->
<header class="hero" id="hero">
  <img class="hero__poster" src="assets/hero-poster.svg" alt="올드 할리우드 극장 무대 위 스포트라이트와 마퀴 조명이 드리운 상영회 홍보 포스터">
  <div class="hero__scrim" aria-hidden="true"></div>
  <div class="hero__cast" aria-hidden="true">
    <img class="hero__cast-figure hero__cast-figure--man" src="assets/characters/man.svg" alt="" onerror="this.style.display='none'">
    <img class="hero__cast-figure hero__cast-figure--girl" src="assets/characters/girl.svg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="hero__content">
    <div class="hero__text-scrim" aria-hidden="true"></div>
    <p class="hero__edition" id="heroEdition"></p>
    <h1 class="hero__title" id="heroTitle"></h1>
    <p class="hero__subtitle" id="heroSubtitle"></p>
    <p class="hero__period" id="heroPeriod"></p>
    <p class="hero__credit" id="heroCredit"></p>
  </div>
  <div class="hero__curtain hero__curtain--left" id="curtainLeft" aria-hidden="true"></div>
  <div class="hero__curtain hero__curtain--right" id="curtainRight" aria-hidden="true"></div>
  <a class="hero__scroll" href="#toc" aria-label="상영 프로그램 목차로 스크롤">
    <span class="hero__scroll-line" aria-hidden="true"></span>
    <span class="hero__scroll-arrow" aria-hidden="true">▾</span>
  </a>
</header>

<!-- ===== 지도 교수진 ===== -->
<section class="faculty" id="faculty" aria-label="지도 교수진 소개">
  <p class="faculty__eyebrow">FACULTY · 지도 교수진</p>
  <div class="faculty__inner">
    <div class="faculty__greeting" id="facultyGreetingBody"><!-- JS 렌더 --></div>
    <p class="faculty__greeting-sign" id="facultyGreetingSign"></p>
  </div>
  <div class="deco-rule faculty__divider" aria-hidden="true"></div>
  <div class="faculty__groups" id="facultyGroups" aria-label="지도 교수진 전체 명단"><!-- JS 렌더 --></div>
</section>

<!-- ===== 3.2 프로그램 목차 ===== -->
<nav class="toc" id="toc" aria-label="상영 프로그램 목차">
  <div class="toc__marquee-frame">
    <p class="toc__eyebrow">NOW SHOWING · 오늘의 상영작</p>
    <ol class="toc__list" id="tocList"><!-- JS 렌더 --></ol>
  </div>
</nav>

<!-- ===== 3.3 상영 프로그램 ===== -->
<main class="program" id="program" aria-label="상영 프로그램 전체 10편">
  <div class="program__intro">
    <p class="program__eyebrow">The Program</p>
    <h2 class="program__heading">상영 프로그램</h2>
  </div>
  <div class="team-cards" id="teamCards"><!-- JS 렌더 --></div>
</main>

<!-- ===== 3.4 크레딧 / 문의 ===== -->
<footer class="credits" id="credits">
  <div class="credits__ornament" aria-hidden="true">✦</div>
  <p class="credits__eyebrow">End Credits</p>
  <h2 class="credits__title" id="creditsDept"></h2>
  <p class="credits__sub">감상해 주신 모든 분들께 감사드립니다.</p>
  <div class="credits__contact">
    <p><span>학과 사이트</span><a id="creditsWebsite" href="#" target="_blank" rel="noopener noreferrer"></a></p>
    <p><span>인스타그램</span><a id="creditsInstagram" href="#" target="_blank" rel="noopener noreferrer"></a></p>
  </div>
  <p class="credits__fineprint">© 2026 Animation &amp; Webtoon Graduation Showcase. All rights reserved.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
