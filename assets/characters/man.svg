<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 900" width="300" height="900" role="img" aria-label="정장을 입은 남성 실루엣 플레이스홀더">
  <defs>
    <linearGradient id="manFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8B876"/>
      <stop offset="100%" stop-color="#A9834B"/>
    </linearGradient>
  </defs>
  <g fill="url(#manFill)" opacity="0.95">
    <!-- hair -->
    <path d="M 108,40 Q150,12 192,40 L 192,58 Q150,36 108,58 Z"/>
    <!-- head -->
    <circle cx="150" cy="72" r="40"/>
    <!-- neck -->
    <rect x="136" y="106" width="28" height="22" rx="6"/>
    <!-- shoulders / vest -->
    <path d="M 84,150 L 150,132 L 216,150 L 210,250 Q150,268 90,250 Z"/>
    <!-- tie -->
    <path d="M 140,132 L 160,132 L 154,168 L 150,182 L 146,168 Z"/>
    <!-- raised arm (adjusting cuff) -->
    <path d="M 84,150 C 56,168 44,200 52,232 C 56,246 74,248 82,238 C 76,214 80,186 100,164 Z"/>
    <!-- straight arm -->
    <path d="M 216,150 C 244,172 252,214 240,254 C 236,266 218,266 212,254 C 222,224 216,188 198,166 Z"/>
    <!-- trousers -->
    <path d="M 90,250 Q150,266 210,250 L 210,300 L 158,300 L 156,760 Q150,772 144,760 L 142,300 L 90,300 Z"/>
    <!-- cuff fold lines -->
    <rect x="96" y="520" width="60" height="8" rx="4" opacity="0.55"/>
    <rect x="148" y="600" width="60" height="8" rx="4" opacity="0.55"/>
    <!-- shoes -->
    <path d="M 118,760 L 158,760 L 168,784 Q140,796 108,786 Z"/>
    <path d="M 150,760 L 190,760 L 200,784 Q172,796 140,786 Z"/>
  </g>
</svg>
